name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-equivalence:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/tmp
      TMP: ${{ github.workspace }}/Build/tmp
      TEMP: ${{ github.workspace }}/Build/tmp
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@v4
      - name: Stage source and restored project inputs under Build
        run: |
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
          mkdir -p "$TMPDIR"
        working-directory: ${{ github.workspace }}
      - uses: actions/checkout@v4
        with:
          repository: alblue/SILInspector
          ref: 6a69cea5126af73dc1964cf92bfa397da3e18752
          path: 'Build/源码/_reference'
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build application
        run: 'xcodebuild -project SILGallery.xcodeproj -target SILGallery -configuration Release CODE_SIGNING_ALLOWED=NO SYMROOT="$GITHUB_WORKSPACE/Build/输出/xcode-products" OBJROOT="$GITHUB_WORKSPACE/Build/输出/xcode-intermediates" build'
      - name: Compare real controller and compiler outputs
        run: python3 checks/gallery_equivalence.py --reference _reference/SILInspector/AppDelegate.swift
      - name: Check bounded process exchange and large source
        run: python3 checks/gallery_process_safety.py
